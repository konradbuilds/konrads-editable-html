<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <rect width="1544" height="500" fill="#2e1b42"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="132" font-size="50" font-weight="600" fill="#ffffff" letter-spacing="-1.5">Konrad's Editable HTML</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" transform="translate(96 186)">
